# options-test.yaml — options market-data integration-test preset (CR-9).
#
# A consumer (e.g. Vivaldi's vivaldi-optdata) can boot this verbatim and read the
# Binance-EAPI-compatible options surface on http://localhost:8192:
#
#   GET /eapi/v1/exchangeInfo                 option contract specs
#   GET /eapi/v1/mark[?symbol=...]            mark price + IV + greeks (no rho)
#   GET /eapi/v1/depth?symbol=...&limit=...   synthetic order book
#   GET /eapi/v1/index?underlying=BTCUSDT     spot index
#
# The same book is also public market data on:
#   Deribit  :8193  GET /api/v2/public/ticker?instrument_name=BTC-31DEC26-50000-C
#   OKX      :8194  GET /api/v5/public/opt-summary?instId=BTC-USD-261231-50000-C
#   Bybit    :8195  GET /v5/market/tickers?category=option&symbol=BTC-31DEC26-50000-C
#
# It is the oms-test preset + an options surface. Deterministic + offline:
#   * emulator.enabled: false  -> the spot book is empty, so the options index
#                                 uses the configured static_index (50000) rather
#                                 than a live mid. Marks are pure Black-Scholes off
#                                 that index + the configured vol surface.
#   * European, CASH-settled (USDT) options; expiry 08:00 UTC on the dates below.
#   * spot /api/v3 order entry still works (same as oms-test) for combined tests.
#
# Boot:  EXCHANGE_CONFIG=configs/options-test.yaml go run ./cmd/exchange
network:
  listen_grpc: ":50091"
  listen_http: ":8190"
  listen_ws: ":8191"
  token_secret: "options-test-token"
  tls:
    cert_file: ""
    key_file: ""
database:
  dsn: "memory"
limits:
  max_open_orders: 5000
  min_tick_size: 0.01
instruments:
  - symbol: "BTC-USD"
    base: "BTC"
    quote: "USD"
storage:
  wal_path: "data/options-test.wal"
api:
  binance:
    enabled: true
    listen: ":8192"
    api_key: "k"
    secret: "s"
    rate_per_sec: 0
    burst: 0
    symbols:
      - binance: "BTCUSDT"
        engine: "BTC-USD"
    balances:
      USD: "1000000"
      BTC: "10"
      # Options above are CASH-settled in USDT against the OTC contract assets,
      # and the underlyings quote/coin USDT + ETH — a buyer reserves USDT and a
      # settlement credits USDT, so seed them or option order entry fails -2010
      # (mirror of the BTC/USD spot balances above).
      USDT: "10000000"
      ETH: "10"
    options:
      enabled: false  # alias of the top-level options book; leave off while that book is set
  coinbase:
    enabled: false
options:
  enabled: true
  rate: 0.03
  iv_spread: 0.02
  book_half_spread: 0.02
  price_band: 0.5
  venues:
    - name: binance
    - name: deribit
      listen: ":8193"
    - name: okx
      listen: ":8194"
    - name: bybit
      listen: ":8195"
  underlyings:
    - underlying: "BTCUSDT"
      coin: "BTC"
      quote: "USDT"
      index_engine: "BTC-USD"
      static_index: 50000
      atm_vol: 0.65
      skew: -0.05
      smile: 0.10
      dividend_yield: 0
      expiries:
        - "2026-12-31"
        - "2027-03-27"
      strikes: [40000, 50000, 60000, 70000]
    - underlying: "ETHUSDT"
      coin: "ETH"
      quote: "USDT"
      static_index: 3000
      atm_vol: 0.65
      skew: -0.05
      smile: 0.10
      dividend_yield: 0
      expiries:
        - "2026-12-31"
        - "2027-03-27"
      strikes: [2500, 3000, 3500, 4000]
  # FLOW EXOTICS (dealer-quoting mode). Uncomment to list exotics next to the
  # vanilla chains: the book holds the saga pricer (../price-master-examples)
  # and quotes each exotic against its ACTUAL payoff (inline `payoff` or
  # `payoff_file` below that repo) — never via vanilla legs. Served on
  #   GET /eapi/v1/mark/exotic[?symbol=...]     fair value + bid/ask + provenance
  #   GET /eapi/v1/exchangeInfo                 lists the exotic contracts
  # Determinism note: exotic marks require the saga binary and are cached for
  # `exotic_ttl`; the vanilla chain above stays pure Black–Scholes and is the
  # part pinned by the recorded fixture goldens. A missing binary is a boot
  # warning (vanilla chain still serves), not a failure.
  # pricer: "saga"
  # exotic_vol: 0.30
  # exotic_rate: 0.05
  # exotic_num_paths: 65536
  # exotic_num_steps: 252
  # exotic_seed: 42
  # exotic_expiry_years: 1.0
  # exotic_spread_bps: 10     # bid/offer half-spread, bps of fair value (0 => book_half_spread)
  # exotic_ttl: "5s"          # one engine call per exotic per interval
  # exotic_max_fair_value: 0  # risk limit: a fair value above this is not quoted (0 = none)
  # exotics:
  #   - coin: "BTC"
  #     underlying: "BTCUSDT"
  #     expiry: "2026-12-31"
  #     strike: 50000
  #     kind: "C"
  #     venue_symbol: "BTC-261231-50000-BAR"   # last token must NOT be C/P
  #     payoff_file: "payoffs/barrier_down_out_call.aria"
  #     # or an inline Aria payoff (exactly one of payoff / payoff_file):
  #     # payoff: |
  #     #   contract DownAndOutCall { let S = spot("X") var alive = 1.0
  #     #     alive := alive * cond(S > 30000, 1.0, 0.0)
  #     #     one(KRW) |> scale(alive * max(S - 50000, 0.0)) |> when(2026-12-31) }
metrics:
  enabled: false
emulator:
  enabled: false
transfer:
  enabled: false
