network:
  listen_grpc: ":50051"
  listen_http: ":8080"
  listen_ws: ":8081"
  token_secret: "dev-secret-token"
  tls:
    cert_file: "certs/dev-cert.pem"
    key_file: "certs/dev-key.pem"
database:
  dsn: "memory"
limits:
  max_open_orders: 5000
  min_tick_size: 0.01
instruments:
  - symbol: "BTC-USD"
    base: "BTC"
    quote: "USD"
  - symbol: "ETH-USD"
    base: "ETH"
    quote: "USD"
  - symbol: "BTC-EXOT-C"      # quote-only flow exotic (see api.fix.quotes); empty book holds quoted confirms
    base: "BTC"
    quote: "USD"
storage:
  wal_path: "data/exchange.wal"
# Options book (CR-9 + dealer-quoting mode): one European cash-settled (USDT)
# chain priced with the INTERNAL Black–Scholes model + per-underlying smile,
# published on the Binance EAPI edge (here :8082) and, when `venues` is
# extended, the Deribit/OKX/Bybit-compatible shapes too —
# GET /eapi/v1/{exchangeInfo,mark,mark/exotic,depth,index}.
#
# Flow exotics: when `exotics` is non-empty the book holds the pricer plugin
# (the saga binary from ../price-master-examples) and lists the exotics next
# to the vanilla chain. Each exotic is priced AGAINST ITS ACTUAL payoff
# (inline `payoff` script or `payoff_file` relative to that repo) — never
# decomposed into vanilla legs — and /eapi/v1/mark/exotic returns the fair
# value bracketed by exotic_spread_bps plus the pricer/model provenance.
# A missing saga binary is a warning at boot, not a failure (the vanilla
# chain keeps serving; exotic marks report no price until it is present).
options:
  enabled: true
  rate: 0.03
  iv_spread: 0.02
  book_half_spread: 0.02
  price_band: 0.5
  venues:
    - name: binance
  underlyings:
    - underlying: "BTCUSDT"
      coin: "BTC"
      quote: "USDT"
      index_engine: "BTC-USD"     # live book mid is the index (emulator on)
      static_index: 50000         # fallback when the book is empty
      atm_vol: 0.65
      skew: -0.05
      smile: 0.10
      expiries: ["2026-12-31"]
      strikes: [40000, 50000, 60000]
  # One flow exotic (down-and-out barrier call). The shipped payoff_file is a
  # demo with K=100/B=80 (suited to ~$100 underlyings); at BTC spot it is
  # instantly knocked out (fair <= 0 → an error, never a free instrument).
  # For a live ATM-ish barrier, use an inline `payoff` (see api.fix.quotes).
  pricer: "saga"
  exotic_vol: 0.30
  exotic_rate: 0.05
  exotic_num_paths: 65536
  exotic_num_steps: 252
  exotic_seed: 42
  exotic_expiry_years: 1.0
  exotic_spread_bps: 10
  exotic_ttl: "5s"
  exotics:
    - coin: "BTC"
      underlying: "BTCUSDT"
      expiry: "2026-12-31"
      strike: 50000
      kind: "C"
      venue_symbol: "BTC-261231-50000-BAR"
      payoff_file: "payoffs/barrier_down_out_call.aria"
# Binance-spot-compatible REST edge (PLAN Phase 8 — a documented SUBSET). When
# enabled, a stock Binance client (CCXT, python-binance) pointed at `listen`
# with only the base URL changed can place/cancel/query orders and read
# depth/ticker. REST only; the WebSocket user-data / market streams are a noted
# follow-up. Disabled by default.
api:
  binance:
    enabled: false
    listen: ":8082"
    api_key: ""                # credential the client sends in X-MBX-APIKEY
    secret: ""                 # HMAC-SHA256 signing secret
    rate_per_sec: 20           # token-bucket refill per API-key/IP; <=0 disables
    burst: 40                  # bucket capacity (max instantaneous burst)
    symbols:                   # Binance concatenated symbol -> engine instrument
      - binance: "BTCUSDT"
        engine: "BTC-USD"
      - binance: "ETHUSDT"
        engine: "ETH-USD"
    balances:                  # seed the account ledger (asset -> free amount). When set,
      USD: "1000000"           # /account reports live balances and LIMIT orders lock funds
      BTC: "10"                # (rejected if insufficient) + settle on fill. Empty = stub.
      ETH: "100"
  # Coinbase-Advanced-Trade-compatible REST edge (PLAN Phase 9 — a documented
  # SUBSET). When enabled, a client (CCXT in HMAC mode) pointed at `listen` with
  # only the base URL changed can place/cancel/query orders and read the product
  # book + a product ticker. REST only; the WebSocket channels are a noted
  # follow-up. Auth uses the legacy Coinbase Exchange HMAC scheme (CB-ACCESS-*);
  # production JWT/ES256 is deferred. Disabled by default.
  coinbase:
    enabled: false
    listen: ":8083"
    api_key: ""                # credential the client sends in CB-ACCESS-KEY
    secret: ""                 # HMAC-SHA256 signing secret (base64 or raw)
    passphrase: ""             # optional; enforced only if set
    rate_per_sec: 20           # token-bucket refill per API-key/IP; <=0 disables
    burst: 40                  # bucket capacity (max instantaneous burst)
    fee_rate: "0.006"          # fee fraction on filled value -> total_fees (empty => 0.006 default)
    products:                  # allow-list of product IDs (== engine instruments)
      - "BTC-USD"
      - "ETH-USD"
  # FIX 4.4 acceptor edge (CR-8): order entry + market-data liquidity search,
  # and — with `quotes` — quote-driven OTC order entry for flow exotics. The
  # saga pricer plugin prices each exotic's ACTUAL configured payoff (an
  # inline Aria script or a payoff_file path, e.g.
  # `payoffs/barrier_down_out_call.aria`) at the live book mid; bid =
  # fair·(1−w) and offer = fair·(1+w) where w = spread_bps/10000. Clients:
  # quote via 35=z → get 35=S, confirm via 35=D with QuotedOrderFlag=Y (692)
  # + OrderID=117, or just send a plain D on an exotic symbol and get a fresh
  # quote back. Requires ../price-master-examples (bin/reassemble.sh once)
  # for the saga binary. Disabled by default.
  fix:
    enabled: false
    listen: ":8193"
    sender_comp_id: "MIRAGE"
    symbols:
      - binance: "BTCUSDT"
        engine: "BTC-USD"
      # Quote-only exotic. Not a funded instrument — no entry in the
      # top-level instruments: list; it trades only via the quote flow. The
      # engine symbol is referenced by quotes.exotics[].engine below.
      - binance: "BTC-EXOT-C"
        engine: "BTC-EXOT-C"
    quotes:
      enabled: false
      pricer: "saga"           # registered pricer backend
      exotics:                 # each entry = engine symbol + its ACTUAL payoff + model knobs
        - engine: "BTC-EXOT-C"
          payoff_file: "payoffs/barrier_down_out_call.aria"   # down-and-out call (K=100, B=80)
          vol: 0.30                                    # pricing vol; per-exotic .vol overrides the shared quotes.vol
          # Alternatively, an inline Aria contract (exactly one of payoff /
          # payoff_file must be set per exotic):
          # payoff: |
          #   contract DownAndOutCall { let S = spot("X") var alive = 1.0
          #     alive := alive * cond(S > 80.0, 1.0, 0.0)
          #     one(KRW) |> scale(alive * max(S - 100.0, 0.0)) |> when(2026-01-01) }
      spot_from:               # exotic -> engine instrument whose book mid is the pricing spot (default: the exotic's own book)
        "BTC-EXOT-C": "BTC-USD"
      vol: 0.30                # default pricing vol (annualized); per-exotic .vol overrides
      # rate: 0.05             # risk-free rate (annualized); 0 = backend default
      # expiry_years: 1.0      # default T in years; 0 => 1.0
      spread_bps: 10           # quote half-spread per side, bps of fair value (0 => 10)
      num_paths: 65536
      num_steps: 252
      seed: 42
      quote_ttl: "5m"
# Prometheus-text metrics endpoint. When enabled, a dedicated unauthenticated
# HTTP listener serves /metrics (conventional for a scrape endpoint). The
# emulator pipeline and API edges register their counters/gauges here.
metrics:
  enabled: true
  listen: ":9090"              # GET http://localhost:9090/metrics
# Live-venue emulation: mirror a real exchange's order book into the engine as
# synthetic liquidity, converging back to the reference after user trades.
# Set enabled: false to run as a plain matching engine (offline).
emulator:
  enabled: true
  venue: "coinbase"            # coinbase | binance
  instruments: ["BTC-USD", "ETH-USD"]   # must match engine symbols above
  reference:
    depth_levels: 20           # price levels per side to mirror (0 = full book)
    refresh_ms: 250            # reconcile / convergence cadence
  rtr:
    tau_ms: 3000               # return-to-reference horizon; 0 = instant mirror
  toxicity:                    # adverse selection; scale 0 = off (pure return-to-reference)
    scale: 0.0                 # >0 enables: resting user orders get picked off more in toxic flow
    kyle_weight: 1.0           # lambda → price penetration of the adverse sweep
    vpin_weight: 1.0           # VPIN → adverse-fill probability
    window_trades: 500         # rolling window for the lambda regression
    bucket_volume: 1.0         # VPIN volume-bucket size (base asset)
    buckets: 50                # VPIN buckets averaged
    seed: 42                   # deterministic firing
  price_shift:                 # artificial price shift — manufacture cross-venue arb (test bed)
    offset_bps: 0              # additive shift in basis points (0 = none)
    scale: 1.0                 # multiplicative shift (1.0 = none); shifted = price*scale*(1+offset_bps/10000)
  latency:                     # artificial latency injection (test bed); all 0 = no added delay
    feed_to_book_ms: 0         # delays the reference goroutine (a slow feed)
    order_ack_ms: 0            # API-edge ack delay (Phase 8/9)
    fill_report_ms: 0          # API-edge fill-report delay (Phase 8/9)
    jitter_ms: 0               # stochastic delay on top of each base delay (see distribution)
    distribution: "uniform"    # uniform = [0, jitter_ms); poisson = shifted-Poisson, mean jitter_ms (bursty tail)
  scenario:                    # scripted test-bed timeline (Phase 7); empty file = static controls (no runner)
    file: ""                   # path to a JSONL scenario; each line: {"at_ms":N,"action":"price_shift|latency","params":{...}}
    speed: 1.0                 # schedule scaling: 1.0 = real time, >1 accelerates (10 runs a 10s timeline in 1s)
  replay:                      # used only when venue: replay — run the whole emulator offline from a recorded trace
    file: ""                   # JSONL trace (cmd/feedcat -record output); required when venue=replay
    speed: 0.0                 # <=0 = as-fast-as-possible (deterministic); 1.0 = real time; 10.0 = 10x
# On-chain transfer flow (PLAN Phase 10 follow-up): an external arb bot can move
# inventory between the two venue accounts. A withdrawal debits the source
# venue's ledger and sends a REAL testnet tx from its custody hot wallet to the
# destination venue's deposit address; a watcher credits the destination ledger
# when funds land. Testnet-only (Stellar/xlm for now). Disabled by default.
# Requires CUSTODY_PASSPHRASE + a keystore with the named hot wallets (funded).
# Exposed via POST /transfer (native, token auth) and Binance
# /sapi/v1/capital/withdraw/apply (signed).
transfer:
  enabled: false
  keystore_path: "data/custody.keystore.json"
  poll_ms: 5000                # deposit poll interval
  venues:
    binance:  { wallet: "binance-hot" }   # custody keystore wallet (chain xlm)
    coinbase: { wallet: "coinbase-hot" }
